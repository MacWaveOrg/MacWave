name: Sync payloads

# 抓上游产物 → 校验 sha256 → 发布到 Bottle / Deps 的 Release。
#
# 为什么必须在 GitHub Actions 里跑：上游（github.com）从大陆网络经常连不上
# （实测三次里两次连 TCP 都建不起来），而 Runner 就在 GitHub 机房内，不存在
# 国际出口问题。任何跑在大陆机器上的同步脚本都会反复失败，重试也救不了。
#
# 发布之后的链路是：
#   GitHub Releases  →  香港镜像站（国际链路，正常）  →  大陆用户（20~50ms）
#
# 需要 secret: MACWAVE_RELEASE_TOKEN
#   一个有 MacWaveOrg 下 Bottle 与 Deps 仓库 contents:write 的 PAT。
#   GITHUB_TOKEN 不行 —— 分支保护与跨仓库写入都进不去。

on:
  workflow_dispatch:
    inputs:
      kinds:
        description: "Which payloads to sync"
        type: choice
        options: [both, bottle, deps]
        default: both
      only:
        description: "Comma separated package names (empty = all)"
        default: ""
      publish:
        description: "Upload to Releases (uncheck to only download and verify)"
        type: boolean
        default: true
      infosource_ref:
        description: "Branch or tag of MacWaveOrg/infosource to read (empty = main)"
        default: ""
      probe_sha:
        description: "Report the real sha256 of records whose sha256 is all zeros"
        type: boolean
        default: false
  schedule:
    # 每周一 03:17 UTC：把新增的索引记录补进 Release。只增不删，所以可以放心重复跑。
    - cron: "17 3 * * 1"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      GH_TOKEN: ${{ secrets.MACWAVE_RELEASE_TOKEN }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout MacWave
        uses: actions/checkout@v4

      # 索引是纯数据，直接检出本地副本，不走 api.github.com（未认证只有 60 次/小时）。
      # 默认 main；准备新包的索引还在分支上时，用 infosource_ref 指过去，
      # 这样「代码分支 + 索引分支」可以一起演练，不必先往 main 写半成品。
      - name: Checkout infosource
        uses: actions/checkout@v4
        with:
          repository: MacWaveOrg/infosource
          ref: ${{ github.event.inputs.infosource_ref || 'main' }}
          path: infosource-data

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install requests
        run: python3 -m pip install --quiet requests

      - name: Resolve inputs
        id: opts
        run: |
          # schedule 触发时 inputs 为空，用默认值
          kinds="${{ github.event.inputs.kinds }}"
          only="${{ github.event.inputs.only }}"
          publish="${{ github.event.inputs.publish }}"

          case "$kinds" in
            bottle|deps) ;;
            *) kinds="bottle,deps" ;;
          esac
          [ -z "$publish" ] && publish="true"

          echo "kinds=$kinds" >> "$GITHUB_OUTPUT"
          echo "only=$only" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "🌊 kinds=$kinds only=${only:-<all>} publish=$publish"

      # 上游不发布校验值时（delta / hyperfine / fx 这类），先在全零占位上写记录，
      # 再让这一步把真实 sha256 打出来回填。sync_payloads 校验失败只打印 12 位前缀，
      # 拿不到完整值。默认关闭，只在补这类上游的包时打开。
      - name: Report real sha256 of placeholder records
        if: github.event.inputs.probe_sha == 'true'
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, re, urllib.request

          root = pathlib.Path("infosource-data/pkg")
          only = {n.strip() for n in (os.environ.get("ONLY") or "").split(",") if n.strip()}
          SHA = re.compile(r'^sha256:\s*"([0-9a-f]{64})"\s*$', re.M)
          URL = re.compile(r'^url:\s*"([^"]+)"\s*$', re.M)

          todo = []
          for arch_dir in sorted(root.glob("pkginfo_*")):
              for rec in sorted(arch_dir.glob("*/_*@*")):
                  if rec.name.endswith("@common"):
                      continue
                  text = rec.read_text()
                  sha, url = SHA.search(text), URL.search(text)
                  if not sha or sha.group(1) != "0" * 64 or not url:
                      continue
                  name, _, version = rec.name[1:].partition("@")
                  if only and name not in only:
                      continue
                  todo.append((arch_dir.name.replace("pkginfo_", ""), name, version, url.group(1)))

          print(f"🌊 {len(todo)} placeholder record(s)", flush=True)
          for arch, name, version, url in todo:
              request = urllib.request.Request(url, headers={"User-Agent": "macwave-probe"})
              digest = hashlib.sha256()
              with urllib.request.urlopen(request, timeout=180) as response:
                  for chunk in iter(lambda: response.read(1 << 20), b""):
                      digest.update(chunk)
              print(f"PROBE {name}|{version}|{arch} {digest.hexdigest()}", flush=True)
          PY

      - name: Fetch upstream payloads and verify checksums
        run: |
          python3 scripts/sync_payloads.py \
            --infosource infosource-data \
            --out staging \
            --kinds "${{ steps.opts.outputs.kinds }}" \
            --only "${{ steps.opts.outputs.only }}" \
            --skip "$(tr '\n' ',' < scripts/known-bad-records.txt)" \
            --jobs 6

      - name: Show what was fetched
        run: |
          echo "🌊 $(find staging -type f | wc -l | tr -d ' ') file(s), $(du -sh staging | cut -f1)"
          find staging -type f | head -20

      - name: Publish to Releases
        if: steps.opts.outputs.publish == 'true'
        run: |
          python3 scripts/publish_payloads.py \
            --staging staging \
            --kinds "${{ steps.opts.outputs.kinds }}" \
            --only "${{ steps.opts.outputs.only }}" \
            --write

      # 回读验证：从刚发布的 Release 把文件拉回来，与暂存目录逐字节比对。
      # 这一步能抓住「上传成功但内容不对」——比如资产名被 GitHub 改写、
      # 或者 URL 里 @ 的编码在服务端解不出来。
      - name: Verify by downloading back
        if: steps.opts.outputs.publish == 'true'
        run: |
          python3 scripts/sync_payloads.py \
            --infosource infosource-data \
            --out verified \
            --kinds "${{ steps.opts.outputs.kinds }}" \
            --only "${{ steps.opts.outputs.only }}" \
            --skip "$(tr '\n' ',' < scripts/known-bad-records.txt)" \
            --source payload \
            --jobs 4

          echo "🌊 comparing staging with verified"
          diff -r staging verified && echo "🌊 identical"

      # 香港镜像站可以用这个产物同步，不必逐个访问 Release。
      - name: Upload mirror tree as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirror-tree
          path: staging
          retention-days: 7
