name: Format Test

on:
  push:
    branches: [2.1.0, main, 2.2.0, 2.3, 2.4, 2.5, 3.0]
  pull_request:
    branches: [2.1.0, main, 2.2.0, 2.3, 2.4, 2.5, 3.0]
  workflow_dispatch:

jobs:
  format-test:
    runs-on: macos-latest
    # api.github.com 未认证只有 60 次/小时，Runner 共用出口 IP 很容易被限流；
    # pkg/pkginstaller.py 与 pkg/pkginfohelper.py 会在拿到 GH_TOKEN 时带上它。
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
    strategy:
      # 3.14 与 3.15 各跑一条线；一条挂了不要取消另一条，否则看不出是哪个版本的问题
      fail-fast: false
      matrix:
        # 3.14 是环境下限（.conda 需要 compression.zstd），3.15 是上游最新正式版
        python-version: ['3.14', '3.15']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 审计需要 infosource 仓库的数据。直接检出本地副本，不走 api.github.com：
      # 未认证只有 60 次/小时，而 Runner 共用出口 IP，很容易被限流。
      - name: Checkout infosource data
        uses: actions/checkout@v4
        with:
          repository: MacWaveOrg/infosource
          ref: main
          path: infosource-data

      - name: Setup Python
        if: matrix.python-version != '3.15'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # actions/python-versions 里目前只有 3.15 的 rc（没有 3.15.0 正式版），
      # setup-python 取不到："The version '3.15' ... was not found"。
      # Homebrew 有现成的 3.15.0 bottle，装完用 venv 隔离，免得撞上
      # Homebrew Python 的 PEP 668 externally-managed 限制。
      - name: Setup Python 3.15 (Homebrew + venv)
        if: matrix.python-version == '3.15'
        run: |
          brew install python@3.15
          "/opt/homebrew/opt/python@3.15/bin/python3.15" -m venv "$RUNNER_TEMP/venv315"
          echo "$RUNNER_TEMP/venv315/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv315/bin/python3" -VV

      - name: Install Python dependencies
        run: pip install requests packaging rich

      - name: Setup MacWave config
        run: |
          sudo mkdir -p /opt/macwave_config
          sudo tee /opt/macwave_config/config.json > /dev/null << EOF
          {"base_dir": "/tmp/macwave-test"}
          EOF
          sudo tee /opt/macwave_config/VERSION.json > /dev/null << EOF
          {"version": "2.1.0"}
          EOF
          sudo chown -R $(whoami) /opt/macwave_config
          mkdir -p /tmp/macwave-test/bin /tmp/macwave-test/links /tmp/macwave-test/pkg /tmp/macwave-test/surfboard /tmp/macwave-test/downloads/tmp

      - name: Deploy scripts
        run: |
          cp pkg/*.py pkg/*.sh /tmp/macwave-test/pkg/
          cp surfboard/*.py surfboard/*.sh /tmp/macwave-test/surfboard/
          chmod +x /tmp/macwave-test/surfboard/*.sh
          mkdir -p /tmp/macwave-test/lib
          cp lib/*.py /tmp/macwave-test/lib/
          cp lib/*.sh /tmp/macwave-test/lib/
          cp lib/wave.py /tmp/macwave-test/lib/wave
          chmod +x /tmp/macwave-test/lib/wave /tmp/macwave-test/lib/*.sh

      - name: Run config path test
        run: |
          bash scripts/configpath_test.sh

      - name: Audit dependency data
        run: |
          python3 scripts/audit_deps.py data --data-dir infosource-data

      - name: Run format tests
        run: |
          bash scripts/format_test.sh

      - name: Run dependency chain test
        run: |
          bash scripts/deps_test.sh

      - name: Run unversioned link test
        run: |
          bash scripts/link_test.sh

      # 会真的按 configdata 仓库的 update_command 更新一遍安装目录，所以放最后
      - name: Run selfupdate test
        run: |
          bash scripts/selfupdate_test.sh

  # 随机化端到端回归：每次抽 10~20 个包 + 随机参数/随机打断 + 固定命令覆盖。
  # 自带安装目录挑选、部署与清理，所以不需要上面那一套 sudo 配置。
  random-test:
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14', '3.15']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout infosource data
        uses: actions/checkout@v4
        with:
          repository: MacWaveOrg/infosource
          ref: main
          path: infosource-data

      - name: Setup Python
        if: matrix.python-version != '3.15'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 与上面的 format-test 同因：setup-python 还没有 3.15.0 正式版可用。
      - name: Setup Python 3.15 (Homebrew + venv)
        if: matrix.python-version == '3.15'
        run: |
          brew install python@3.15
          "/opt/homebrew/opt/python@3.15/bin/python3.15" -m venv "$RUNNER_TEMP/venv315"
          echo "$RUNNER_TEMP/venv315/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv315/bin/python3" -VV

      - name: Install Python dependencies
        run: pip install requests packaging rich

      # 步骤级 timeout 低于 job 级：超时是"步骤失败"，这样下面的 always() 仍会上传日志
      - name: Run randomized regression
        timeout-minutes: 100
        run: |
          python3 -u scripts/random_test.py \
            --infosource infosource-data \
            --log-file "$RUNNER_TEMP/random-test-${{ matrix.python-version }}.log"

      - name: Upload the regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: random-test-${{ matrix.python-version }}-log
          path: ${{ runner.temp }}/random-test-${{ matrix.python-version }}.log
          if-no-files-found: warn
          retention-days: 14
