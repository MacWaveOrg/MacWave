name: Portable Python

# 给 configdata 的 pythondata/latest_python 填上「自带 Python」的真实地址与校验值。
#
# 为什么不在本地打包：上游 astral-sh/python-build-standalone 已经发布了可直接使用的
# install_only 产物，解压后解释器就在 python/install/bin/python3 —— 这正好在
# install.sh / selfupdate.sh 的 portable_python_binary 探测列表里。自己再 repack 一遍
# 只是把几十 MB 在本地搬来搬去，换来的唯一好处是去掉一层目录名，而那一层已经能处理。
#
# 所以这里只做三件便宜的事：
#   1. 按 pythondata 里声明的 version，逐架构找到上游对应的 install_only 资产；
#   2. 下载并亲自算一次 sha256（不信「上游说它是多少」，也顺便证明这个地址真的能下）；
#   3. 确认压缩包解开后确实有 python/install/bin/python3，否则装了也定位不到解释器。
# 然后把结果写成 configdata 的 PR —— pythondata 受分支保护，不能直接推。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "要打包的 CPython 版本（留空则读 configdata 里的声明）"
        required: false
      create_pr:
        description: "把结果写成 configdata 的 PR"
        type: boolean
        default: true
  schedule:
    # 每月核对一次：上游归档被撤掉、或者校验值与声明漂移，都能提前发现
    - cron: '0 3 1 * *'
  push:
    paths:
      - 'scripts/build_portable_python.sh'
      - '.github/workflows/portable-python.yml'

permissions:
  contents: read

env:
  UPSTREAM_REPO: astral-sh/python-build-standalone
  CONFIGDATA_URL: https://raw.githubusercontent.com/MacWaveOrg/configdata/main
  # configdata 里还没有声明时的兜底：让本工作流在 pythondata 第一次落地之前就能跑通
  DEFAULT_PYTHON_VERSION: "3.14.9"

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      arm64_url: ${{ steps.pick.outputs.arm64_url }}
      arm64_sha256: ${{ steps.pick.outputs.arm64_sha256 }}
      amd64_url: ${{ steps.pick.outputs.amd64_url }}
      amd64_sha256: ${{ steps.pick.outputs.amd64_sha256 }}
      changed: ${{ steps.pick.outputs.changed }}
    steps:
      - name: Pick the version to bundle
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # 声明可能在 configdata 里，也可能还没落地（第一次跑就是这种情况）
          # set -o pipefail 下，curl 的 404 会让整个赋值失败并直接退出脚本 ——
          # 那样下面的兜底就永远走不到。这里显式吞掉失败。
          declared="$(curl -fsSL --max-time 30 "$CONFIGDATA_URL/pythondata/latest_python" 2>/dev/null \
            | sed -n 's/^version:[[:space:]]*"\(.*\)"/\1/p' | head -n 1 || true)"
          version="${REQUESTED:-${declared:-$DEFAULT_PYTHON_VERSION}}"
          if [ -z "$version" ]; then
            echo "::error::No version to bundle."
            exit 1
          fi
          echo "Bundling CPython $version (requested=${REQUESTED:-none}, declared=${declared:-none})"

          # 上游按日期打 tag，资产名是确定的：
          #   cpython-<版本>+<tag>-<triple>-install_only.tar.gz
          # 所以既不需要 GitHub API 的 release 列表，也不需要资产清单 ——
          # 之前那两步都踩过坑（[].tag_name 在 CI 里拿到空数组、/tags/{tag}/assets 根本不存在）。
          # 这里只取 tag 名，然后逐个用 HEAD 探确定的 URL，第一个 200 就是最新的构建。
          tags="$(git ls-remote --tags --refs "https://github.com/$UPSTREAM_REPO" 2>/dev/null \
            | awk '{print $2}' | sed 's#refs/tags/##' | grep -E '^[0-9]+$' | sort -r | head -n 6)"
          if [ -z "$tags" ]; then
            echo "::error::Cannot list upstream tags for $UPSTREAM_REPO."
            exit 1
          fi
          echo "Recent upstream tags: $(echo "$tags" | tr '\n' ' ')"

          resolve() {
            # resolve <triple>：打印匹配资产的下载地址，找不到返回 1
            local triple="$1"
            local tag url
            for tag in $tags; do
              url="https://github.com/$UPSTREAM_REPO/releases/download/$tag/cpython-$version+$tag-$triple-install_only.tar.gz"
              if curl -fsIL --max-time 60 -o /dev/null "$url" 2>/dev/null; then
                echo "$url"
                return 0
              fi
            done
            return 1
          }

          arm64_url="$(resolve aarch64-apple-darwin)" || {
            echo "::error::No aarch64-apple-darwin install_only asset for CPython $version."
            exit 1
          }
          amd64_url="$(resolve x86_64-apple-darwin)" || {
            echo "::error::No x86_64-apple-darwin install_only asset for CPython $version."
            exit 1
          }

          verify() {
            # verify <url> <label>：下载、自己算校验值、确认解压后的布局能被告安装器定位到。
            # 所有日志都走 stderr，stdout 只留校验值本身。
            local url="$1" label="$2" archive sha
            archive="$RUNNER_TEMP/$(basename "$url")"
            echo "Downloading $url" >&2
            curl -fsSL --retry 3 --retry-delay 5 --max-time 1800 -o "$archive" "$url" >&2
            sha="$(sha256sum "$archive" | awk '{print $1}')"
            listing="$RUNNER_TEMP/listing-$label.txt"
            tar -tzf "$archive" > "$listing"
            # 接受的布局 = install.sh 里 portable_python_binary 能探测到的那些。
            # 允许 ./ 前缀：不同版本的上游产物在这一点上并不统一。
            if ! grep -qE '(^|\./)(python/)?(install/)?bin/python3$' "$listing"; then
              echo "::error::$label archive has no recognisable python3 binary; the installer could not find the interpreter." >&2
              echo "  实际匹配到的 bin/python3* 条目：" >&2
              grep -E 'bin/python3' "$listing" | head -5 >&2 || echo "  （一个都没有）" >&2
              echo "  前十条目：" >&2
              head -10 "$listing" >&2
              exit 1
            fi
            echo "  解释器路径: $(grep -E '(^|\./)(python/)?(install/)?bin/python3$' "$listing" | head -1)" >&2
            echo "  $label: $sha ($(du -h "$archive" | awk '{print $1}'))" >&2
            rm -f "$archive"
            printf '%s' "$sha"
          }

          arm64_sha="$(verify "$arm64_url" arm64)"
          amd64_sha="$(verify "$amd64_url" amd64)"

          # 与 configdata 现状比较：没变就不开 PR，免得每月刷一个空提交
          current="$(curl -fsSL --max-time 30 "$CONFIGDATA_URL/pythondata/latest_python" 2>/dev/null || true)"
          changed=true
          if printf '%s\n' "$current" | grep -qxF "version: \"$version\"" \
             && printf '%s\n' "$current" | grep -qxF "arm64_url: \"$arm64_url\"" \
             && printf '%s\n' "$current" | grep -qxF "arm64_sha256: \"$arm64_sha\"" \
             && printf '%s\n' "$current" | grep -qxF "amd64_url: \"$amd64_url\"" \
             && printf '%s\n' "$current" | grep -qxF "amd64_sha256: \"$amd64_sha\""; then
            changed=false
            echo "configdata already pins CPython $version; nothing to update."
          fi

          {
            echo "### Portable Python $version"
            echo ""
            echo "| arch | archive | sha256 |"
            echo "| --- | --- | --- |"
            echo "| arm64 | \`$(basename "$arm64_url")\` | \`$arm64_sha\` |"
            echo "| amd64 | \`$(basename "$amd64_url")\` | \`$amd64_sha\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "version=$version"
            echo "arm64_url=$arm64_url"
            echo "arm64_sha256=$arm64_sha"
            echo "amd64_url=$amd64_url"
            echo "amd64_sha256=$amd64_sha"
            echo "changed=$changed"
          } >> "$GITHUB_OUTPUT"

  update-configdata:
    needs: resolve
    if: needs.resolve.outputs.changed == 'true' && inputs.create_pr != false
    runs-on: ubuntu-latest
    steps:
      - name: Check out configdata
        uses: actions/checkout@v4
        with:
          repository: MacWaveOrg/configdata
          ref: main
          path: configdata
          # configdata 的分支受规则集保护，GITHUB_TOKEN 进不了 bypass，只能用 PAT
          token: ${{ secrets.AUTOMATION_TOKEN }}

      - name: Rewrite pythondata/latest_python
        working-directory: configdata
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          ARM64_URL: ${{ needs.resolve.outputs.arm64_url }}
          ARM64_SHA: ${{ needs.resolve.outputs.arm64_sha256 }}
          AMD64_URL: ${{ needs.resolve.outputs.amd64_url }}
          AMD64_SHA: ${{ needs.resolve.outputs.amd64_sha256 }}
        run: |
          set -euo pipefail

          if [ -z "${VERSION:-}" ]; then
            echo "::error::Empty version; the resolve job must run first."
            exit 1
          fi

          file=pythondata/latest_python
          for field in version arm64_url arm64_sha256 amd64_url amd64_sha256; do
            grep -qE "^${field}:" "$file" || {
              echo "::error::$file has no '$field' field"
              exit 1
            }
          done

          set_field() {
            # 只替换行首的字段行，不会碰到文件开头那段说明注释
            sed -i -E "s|^$1:.*|$1: \"$2\"|" "$file"
          }

          set_field version "$VERSION"
          set_field arm64_url "$ARM64_URL"
          set_field arm64_sha256 "$ARM64_SHA"
          set_field amd64_url "$AMD64_URL"
          set_field amd64_sha256 "$AMD64_SHA"

          cat "$file"

      - name: Open a pull request
        working-directory: configdata
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
          ARM64_SHA: ${{ needs.resolve.outputs.arm64_sha256 }}
          AMD64_SHA: ${{ needs.resolve.outputs.amd64_sha256 }}
        run: |
          set -euo pipefail

          if git diff --quiet -- pythondata/latest_python; then
            echo "pythondata/latest_python already matches; nothing to do."
            exit 0
          fi

          branch="automation/portable-python-$VERSION"
          git config user.name "MacWave automation"
          git config user.email "automation@macwave.org"
          git checkout -b "$branch"
          git add pythondata/latest_python
          git commit -m "Bundle CPython ${VERSION}"
          git push --force origin "$branch"

          if gh pr list --head "$branch" --json number --jq '.[].number' | grep -q .; then
            echo "A pull request for $branch already exists; updated it in place."
            exit 0
          fi

          body="$RUNNER_TEMP/pr-body.md"
          {
            echo "Points pythondata/latest_python at the upstream python-build-standalone"
            echo "install_only archives. They already contain python/install/bin/python3,"
            echo "which is where the installer probes, so no repack is needed."
            echo ""
            echo "Verified in CI: both archives download, their sha256 was recomputed here,"
            echo "and both contain that path."
            echo ""
            echo "| arch | sha256 |"
            echo "| --- | --- |"
            echo "| arm64 | \`$ARM64_SHA\` |"
            echo "| amd64 | \`$AMD64_SHA\` |"
          } > "$body"

          gh pr create --base main --head "$branch" \
            --title "Bundle CPython ${VERSION}" \
            --body-file "$body"
