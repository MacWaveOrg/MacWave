# .circleci/config.yml
#
# **当前状态：已启用。** 项目走 GitHub App，pipeline 名 `quick-feedback`，
# 触发条件是 `All pushes`。启用过程中踩过的坑记在文末，改这里之前先读一遍。
#
# 角色定位：**快速反馈**。
#
# 权威 CI 仍是 GitHub Actions 的 Format Test（macOS runner，跑全部端到端）。
# 但那条线要装 3.14 / 3.15 两套解释器、要 macOS 工具、要联网取数据，一次十几分钟。
# 这里只跑「与平台无关、不碰网络」的那批：提交后一两分钟就知道逻辑有没有坏，
# 不用等全套跑完才发现一个拼写错误。
#
# 刻意设计成**零配置**：不需要环境变量、不需要 SSH key、不需要 sudo、不检出第二个
# 仓库。所以除了在 CircleCI 里授权这个仓库，没有别的准备工作。

version: 2.1

# 需要 macOS 工具（otool / install_name_tool / codesign）、需要真实下载、
# 或者需要检出 infosource 数据的测试，一律留在这批之外 —— 它们在这里跑不了，
# 硬跑只会给出假绿灯。
#
#   format_test        解压后调 otool 重写 Mach-O
#   deps_test          要 infosource 数据 + 真实下载
#   selfupdate_test    写真实安装目录，依赖 macOS 的权限与签名行为
#   mirror_test        读 macOS 的 defaults
#   configpath_test    依赖 macOS 的默认路径布局
#   link_test          依赖 macOS 的符号链接语义（Linux 上结果不同，不是缺陷）

jobs:
  offline-tests:
    docker:
      # cimg 是 CircleCI 维护的镜像，自带 git / curl / sudo 与常用构建工具。
      # 下面这些离线测试只需要 3.11+（tomllib），用不到 3.14 的任何特性 —— 代码里
      # 也没有 compression.zstd。选 3.13 是因为它的 tag 一定在镜像仓库里；3.14 的
      # tag 发布较晚，用它是拿一次构建去赌 image not found。
      - image: cimg/python:3.13
    # small = 1 vCPU / 2 GB / 5 credits 每分钟，medium 是 10。离线测试用不上 medium，
    # 这一行让同样 30000 credits 从 3000 分钟变成 6000 分钟。
    resource_class: small

    steps:
      - checkout

      - run:
          name: Show the interpreter
          # 下限是 3.11：只有 tomllib 需要它。写成断言是为了让镜像被换掉时立刻失败，
          # 而不是等到某个测试用上不存在的标准库特性才暴露。
          command: |
            python3 -V
            python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'

      - run:
          name: Install Python dependencies
          # 测试只用到 requests；rich 覆盖进度条那条路径，packaging 给版本比较。
          command: python3 -m pip install --quiet requests packaging urllib3 rich

      - run:
          name: Lint Python with ruff
          # 配置在 pyproject.toml：规则集 E/F/W，行宽 100，忽略 E501/E402。
          # 只报告不自动修 —— 改动应当由人提交，CI 不该替人写代码。
          command: |
            python3 -m pip install --quiet ruff
            ruff check lib pkg surfboard scripts

      - run:
          name: Lint shell scripts
          # 配置在 .shellcheckrc。--severity=warning：note 级的风格建议不拦。
          command: |
            python3 -m pip install --quiet shellcheck-py
            shellcheck -S warning lib/*.sh pkg/*.sh surfboard/*.sh scripts/*.sh

      - run:
          name: Compile every Python file
          # 比任何测试都快，也最先抓到语法错误。
          command: python3 -m compileall -q lib pkg surfboard scripts

      - run:
          name: Check shell syntax
          # bash -n 只解析不执行，能在不跑测试的前提下抓到 if/fi、引号不配对。
          command: |
            for file in lib/*.sh pkg/*.sh surfboard/*.sh scripts/*.sh; do
                bash -n "$file" || { echo "syntax error: $file"; exit 1; }
            done
            echo "all shell files parse"

      - run:
          name: Flag and suggestion tests
          command: |
            bash scripts/flags_test.sh
            bash scripts/suggest_test.sh

      - run:
          name: Dependency declarations agree
          # pyproject.toml 与六处安装/CI 配置必须说同一件事
          command: bash scripts/depsync_test.sh

      - run:
          name: Markdown structure
          # 相对链接断了、围栏少一个 ``` —— 都是渲染出来才发现的错
          command: bash scripts/markdown_test.sh

      - run:
          name: Message and domain tests
          command: |
            bash scripts/message_test.sh
            bash scripts/domains_test.sh

      - run:
          name: Output format and update-command tests
          command: |
            bash scripts/info_format_test.sh
            bash scripts/update_commands_test.sh

workflows:
  quick-feedback:
    jobs:
      - offline-tests:
          filters:
            branches:
              # 与 Format Test 的触发分支保持一致。加新发布分支时两处一起改，
              # 否则这条线会静默不跑。
              only:
                - main
                - "4.1"
                - "4.0"
                - "3.2"
                - "3.1"
                - "3.0"

# -------------------- 启用记录 --------------------
#
# 当前状态：已启用。项目 609cb781（pipeline `quick-feedback`），走 GitHub App，
# 触发条件是 `All pushes`。分支白名单在上面的 workflows 里，不在 trigger 里。
#
# 下面三条是启用时踩过的坑，故障复现时按顺序核对：
#
# 1. GitHub App 必须从 CircleCI 发起安装：
#      Org → VCS Connections → GitHub App 卡片 → 走完 GitHub 授权页
#    不要用 github.com/apps/circleci-app/installations/new 直链。直链能装上，
#    但 CircleCI 收不到 state 回调，App 会一直挂在 "Available Providers"，
#    push 永远不触发，而且 GitHub 侧看起来一切正常。
#
# 2. 本组织的 OAuth 集成（URL 里带 /github/）不允许 Follow 项目，
#    Follow 报 "Failed to follow project"。绕法是新建 App pipeline：
#      Project Settings → Project Setup → Add Pipeline → 类型选 GitHub App
#    再给这个 pipeline 加一个 `All pushes` 的 GitHub trigger。
#
# 3. 换镜像时记得同步改 "Show the interpreter" 里的版本断言，否则
#    镜像换了、断言没换，第一步就红，看起来像镜像不存在。
#
# 若要接 GitLab：CircleCI 用「邮箱注册 + GitLab 作为 VCS 集成」的方式授权，
# 不是 GitLab 账号登录。
